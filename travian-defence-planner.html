<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com/beacon.min.js; style-src 'unsafe-inline'; connect-src 'self' https://cloudflareinsights.com/cdn-cgi/rum; base-uri 'none'; form-action 'none'">
<title>Travian Defence</title>
<style>
:root{--bg:#0a0e14;--panel:#111923;--field:#0b1119;--line:#283340;--text:#eef4fa;--dim:#a0adbf;--green:#70efd0;--gold:#ffd184;--red:#ff9aab;--mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#15252b 0,var(--bg) 65%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1120px,calc(100% - 40px));margin:auto;padding:22px 0}
h1,h2,h3,p{margin:0}
h1{font-size:16px;font-weight:650;letter-spacing:-.025em}h1 span{color:var(--dim);font-weight:400}h2{font-size:16px}h3{font-size:14px}
a{color:var(--green)}button,input,select,textarea{font:inherit}
button{border:1px solid var(--line);border-radius:9px;background:#141d27;color:var(--text);padding:8px 12px;cursor:pointer}
button.primary{background:var(--green);color:#10281e;border-color:var(--green);font-weight:650}
button:hover{filter:brightness(1.13)}button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
button.small{font-size:12px;padding:4px 8px}
input:not([type=checkbox]),select,textarea{width:100%;min-width:0;border:1px solid #344251;border-radius:8px;background:var(--field);color:var(--text);padding:9px 11px}
input::placeholder{color:#758397;opacity:1}input[aria-invalid=true]{border-color:var(--red)}
input[type=checkbox]{accent-color:var(--green);width:16px;height:16px;flex-shrink:0}
input[type=file]{font-size:12px}input[type=number]{max-width:110px}
label,legend{display:block;font-size:12px;font-weight:550}label>input:not([type=checkbox]),label>select{margin-top:6px}
fieldset{min-width:0;margin:0;padding:0;border:0}
legend{margin-bottom:5px}summary{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.header,.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.header{margin-bottom:22px}.muted,small{color:var(--dim)}.muted{font-size:12px}.spaced{margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.account-row{display:flex;align-items:end;gap:8px;margin-top:16px;flex-wrap:wrap}.account-row label{flex:1;min-width:180px}
.view-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.view-bar+.map-summary{margin:0 0 16px}
.target-toolbar{margin-bottom:16px}.target-tabs{display:flex;gap:6px;flex-wrap:wrap}.target-tabs button[aria-selected=true]{color:var(--green);border-color:#437e70;background:#0e2823}
#travco-paste{display:block;min-height:145px;margin-top:8px;resize:vertical;font-size:12px}
.call-list{margin-top:14px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.call-list:empty{display:none}.call-list>.muted{padding:12px}.defence-call{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);min-width:0}.defence-call:last-child{border-bottom:0}.call-heading{min-width:0;overflow-wrap:anywhere}.call-location{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:4px;font-size:12px}.call-actions{justify-self:end}.call-actions button{min-height:36px}.call-time .digits{font-size:23px;color:var(--green)}.call-selected{font-size:11px;color:var(--green)}
.call-demand{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:6px;font-size:12px}.defence-call.call-filled{border-left:3px solid var(--gold);background:#201c15}.call-filled .call-time .digits{color:var(--dim)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.check{display:flex;align-items:center;gap:6px;font-weight:400}.checks{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;font-weight:400;font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.chip:has(input:checked){border-color:var(--green);color:var(--green)}
.village-filter{border-radius:999px;max-width:100%;padding:5px 10px;gap:8px}.village-filter label{min-width:0;font-size:12px;cursor:pointer}.village-filter label span{overflow-wrap:anywhere}.village-filter a{flex-shrink:0}
.status{color:var(--dim);font-size:12px;margin-top:10px;overflow-wrap:anywhere}
.status.error,.bad{color:var(--red)}.good{color:var(--green)}.warn{color:var(--gold)}
.notice{padding:8px 10px;border-left:2px solid var(--gold);background:#262114;border-radius:4px;font-size:12px;margin-top:10px}
#village-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.village{border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0;align-self:start}
.village:has(.anvil:checked){border-color:#437e70}
.village-name{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.village-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.village-title .village-name{flex:1;min-width:0}
.village fieldset{margin-top:10px}
.ts{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ts input{margin-top:0!important;padding:4px 8px;max-width:65px}
.hero{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hero-equipment{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.result-views{display:flex;gap:6px;flex-wrap:wrap}.result-views button[aria-pressed=true]{color:var(--green);border-color:#437e70;background:#0e2823}
.send-order{margin-top:14px}.send-order td:first-child{min-width:145px}.send-order td{overflow-wrap:anywhere}.send-order .route{min-width:150px}.send-order .troops{min-width:210px}
.send-order tr.with-hero{background:#172722}.hero-flag{color:var(--gold);font-size:11px}.call-choice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.call-destination{margin-bottom:5px;font-size:11px}.result-hero-choice{display:flex;gap:6px;align-items:center;font-size:11px}.village-filter{flex-wrap:wrap}
#travco-setup-panel{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}#troop-overview-paste{display:block;min-height:145px;resize:vertical;font-size:12px}#import-travco[aria-expanded=true]{color:var(--green);border-color:#437e70;background:#0e2823}
.attack-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:14px}
.arrival-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arrival-inputs input{height:44px;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.arrival-inputs legend{grid-column:1/-1}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.buffer{display:flex;align-items:center;gap:7px;font-weight:400}.buffer input{width:62px;margin:0!important}
.target-control{position:relative;min-width:0}#target-query{height:44px;font-size:14px}
.target-meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#target-map-link{margin-top:10px;font-size:12px}#target-detail{flex:1;min-width:140px}
.target-inputs{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:8px}
#target-x,#target-y{height:44px;padding:9px 5px;text-align:center;font-family:var(--mono)}
.target-options{position:absolute;z-index:10;top:66px;left:0;right:0;max-height:300px;overflow:auto;background:#141f2b;border:1px solid #437e70;border-radius:9px;box-shadow:0 12px 30px #0008}
.target-option{padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.target-option[aria-selected=true],.target-option:hover{background:#203b3a}
.target-option .option-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.target-option .option-owner{font-size:11px;color:var(--dim)}
.target-count{padding:6px 11px;font-size:11px;color:var(--dim)}
.result-village{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.result-heading{padding:10px 12px;background:#141d27}.result-empty{padding:10px 12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
th{color:var(--dim);font-size:11px;font-weight:500;white-space:nowrap}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{min-width:220px;max-width:430px}td.time{min-width:150px}
.mono,.digits{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.digits{letter-spacing:-.045em}.send-time{display:block;font-size:23px;font-weight:600;line-height:1.2;color:var(--green)}
.army{font-weight:600}.sub{display:block;font-size:11px;color:var(--dim);margin-top:3px}
a.send-wait{color:var(--green);text-underline-offset:3px}
.equipment{font-size:11px;margin-top:5px}.equipment summary{color:var(--green)}
.alternative-summary{padding:9px 12px;color:var(--green);font-size:12px}
.result-village tr:last-child td{border-bottom:0}
#result-meta{margin-top:10px}#copy-text{margin-top:10px;min-height:130px}
.timing-summary{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0}.timing-summary .digits{display:block;font-size:28px;line-height:1.2}
.eyebrow{font-size:10px;color:var(--dim);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
[hidden]{display:none!important}
@media(max-width:720px){
  .attack-grid{grid-template-columns:1fr}
  .table-wrap{overflow:visible}table,tbody{display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .result-village tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px;border-bottom:1px solid var(--line)}
  .result-village tr:last-child{border:0}.result-village td{padding:0;border:0}
  .result-village td:first-child{grid-column:1/-1;min-width:0;max-width:none}
  .result-village td.time{grid-column:1;grid-row:2;min-width:0}
  .result-village td:nth-child(2){grid-column:1;grid-row:3}
  .result-village td:nth-child(2)::before{content:"Travel ";color:var(--dim);font:11px system-ui,sans-serif}
  .result-village td:last-child{grid-column:2;grid-row:3;align-self:center;justify-self:end}
}
@media(max-width:560px){main{width:calc(100% - 28px);padding-top:16px}#village-list,.hero-equipment{grid-template-columns:1fr}.panel{padding:14px 12px}.account-row label{flex-basis:100%}.arrival-inputs input{padding:9px;font-size:14px}.target-tabs button{padding:7px 9px}.defence-call{grid-template-columns:minmax(0,1fr) auto;gap:8px 10px}.call-heading{grid-column:1/-1}}
@media(max-width:720px){.send-order tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;border-bottom:1px solid var(--line)}.send-order td,.send-order td:first-child,.send-order td.time,.send-order .route,.send-order .troops{padding:0;border:0;min-width:0;max-width:none}.send-order td::before{content:attr(data-label);display:block;font-size:10px;color:var(--dim);margin-bottom:3px}.send-order .troops{grid-column:1/-1}.send-order .send-time{font-size:20px}.send-order td:last-child{align-self:end;justify-self:end}}
@media print{body{background:white;color:black}.setup,td:last-child,th:last-child{display:none}.panel{border:0}.result-village{break-inside:avoid}.sub,.muted,th{color:#444}.good,.warn,.bad,.send-time{color:black}}
</style>
</head>
<body>
<main>
  <header class="header">
    <h1>TRAVIAN <span>/ Defence</span></h1>
    <span class="muted">TS12 &middot; L! / L# / L* &middot; UTC</span>
  </header>
  <noscript><p class="notice">JavaScript is required.</p></noscript>

  <div class="view-bar setup">
    <button id="cancel-fetch" type="button" class="small" hidden>Cancel map load</button>
  </div>
  <p id="map-status" class="status map-summary setup" role="status" hidden></p>

  <section id="setup-panel" class="panel setup" aria-label="Your setup">
    <div class="section-heading">
      <div><h2>Your setup</h2><p id="setup-summary" class="muted" hidden></p></div>
      <div class="checks"><button id="setup-import" type="button">Import setup</button><button id="import-travco" type="button" aria-expanded="false" aria-controls="travco-setup-panel">Import from Travco</button><button id="save-setup" type="button" disabled>Export</button><button id="setup-collapse" type="button" aria-expanded="true" aria-controls="manual-panel" disabled>Minimize setup</button></div>
    </div>
    <input id="setup-file" type="file" accept=".json,application/json" aria-label="Import setup JSON" hidden>
    <div id="travco-setup-panel" hidden>
      <div class="section-heading"><h3>Travco village overview</h3><button id="clear-troop-overview" type="button" class="small">Clear paste</button></div>
      <label class="spaced">Import troops<textarea id="troop-overview-paste" placeholder="Paste the complete Travco Village overview" spellcheck="false"></textarea></label>
      <p class="muted spaced">Prefills TS, anvils, defenders and escorts. Keeps hero equipment.</p>
    </div>
    <p id="setup-status" class="status" role="status" hidden></p>
    <div id="manual-panel">
      <div class="account-row">
        <label for="player-select">Playing as<select id="player-select" disabled><option value="">Loading accounts...</option></select></label>
      </div>
      <h3 id="anvil-heading" class="spaced" hidden>Anvils</h3>
      <div id="village-list"></div>
      <div id="hero-panel" class="hero" hidden>
        <div class="section-heading"><h3>Hero</h3></div>
        <div id="hero-equipment" class="hero-equipment"></div>
        <label class="check spaced"><input id="hero-only" type="checkbox">Include hero-only options</label>
        <div class="actions"><button id="setup-collapse-bottom" type="button" class="small" aria-expanded="true" aria-controls="manual-panel">Minimize setup</button></div>
      </div>
    </div>
  </section>

  <section id="defence-panel" class="panel setup" aria-label="Defence planning">
    <div class="section-heading target-toolbar">
      <nav class="target-tabs" role="tablist" aria-label="Target source">
        <button id="tab-target" type="button" role="tab" aria-selected="true" aria-controls="target-panel">Defence target</button>
        <button id="tab-calls" type="button" role="tab" aria-selected="false" aria-controls="calls-panel" tabindex="-1">Travco calls</button>
      </nav>
      <label class="buffer">Arrive <input id="buffer-seconds" type="number" min="1" max="86400" step="1" value="60" aria-label="Seconds before the deadline"> seconds before</label>
    </div>

  <div id="calls-panel" role="tabpanel" aria-labelledby="tab-calls" hidden>
    <div class="section-heading"><h2>Travco defence calls</h2><button id="clear-calls" type="button" class="small">Clear</button></div>
    <label class="spaced" for="travco-paste">Import calls<textarea id="travco-paste" placeholder="Paste Travco page or Discord calls" spellcheck="false"></textarea></label>
    <p id="calls-status" class="status" role="status" hidden></p>
    <div id="calls-selection" class="section-heading spaced" hidden><label class="check"><input id="calls-all" type="checkbox">All calls</label><span id="calls-selection-count" class="muted"></span><button id="calculate-calls" type="button" class="primary" disabled>Calculate selected calls</button></div>
    <div id="defence-call-list" class="call-list" role="list"></div>
  </div>

  <div id="target-panel" role="tabpanel" aria-labelledby="tab-target">
    <h2 id="attack-heading">Defence target</h2>
    <div class="attack-grid">
      <div class="target-control">
        <div class="target-inputs">
          <label for="target-query">Target<input id="target-query" type="text" role="combobox" aria-autocomplete="list" aria-controls="target-options" aria-expanded="false" placeholder="Player or village" autocomplete="off" spellcheck="false"></label>
          <label for="target-x">X<input id="target-x" type="number" min="-200" max="200" step="1" autocomplete="off"></label>
          <label for="target-y">Y<input id="target-y" type="number" min="-200" max="200" step="1" autocomplete="off"></label>
        </div>
        <div id="target-options" class="target-options" role="listbox" aria-label="Matching villages" hidden></div>
        <div class="target-meta">
          <a id="target-map-link" class="coordinate-link mono" target="_blank" rel="noopener noreferrer" title="Open on the TS12 map" hidden></a>
          <p id="target-detail" class="status" role="status" hidden></p>
        </div>
      </div>
      <fieldset>
        <legend><span id="deadline-kind">Attack lands</span> <span class="muted">(UTC)</span></legend>
        <div class="arrival-inputs">
          <label class="visually-hidden" for="attack-date">Attack date (UTC)</label>
          <input id="attack-date" type="date" min="1000-01-01" max="9999-12-31">
          <label class="visually-hidden" for="attack-time">Attack time (UTC)</label>
          <input id="attack-time" type="text" placeholder="13:10:01" autocomplete="off" spellcheck="false">
        </div>
      </fieldset>
    </div>
    <div class="actions">
      <button id="calculate" type="button" class="primary" disabled>Calculate</button>
    </div>
  </div>
    <p id="selected-call-status" class="status" role="status" hidden></p>
    <p id="plan-status" class="muted spaced" role="status" hidden></p>
    <p id="plan-error" class="status error" role="alert" hidden></p>
  </section>

  <section id="results" class="panel" aria-labelledby="results-heading" hidden>
    <div class="section-heading">
      <h2 id="results-heading">Send times</h2>
      <div class="result-views" role="group" aria-label="Result view"><button id="view-villages" type="button" class="small" aria-pressed="true">By village</button><button id="view-send-order" type="button" class="small" aria-pressed="false">Send order</button></div>
      <span id="calculated-at" class="muted"></span>
    </div>
    <div id="result-meta"></div>
    <div id="result-village-filters" class="spaced" hidden>
      <div class="section-heading"><h3>Villages</h3><div class="checks"><button id="result-villages-all" type="button" class="small" aria-label="Select all result villages">Select all</button><button id="result-villages-none" type="button" class="small" aria-label="Deselect all result villages">Deselect all</button></div></div>
      <div id="result-village-chips" class="checks spaced" role="group" aria-label="Visible villages"></div>
    </div>
    <div id="send-order-paging" class="section-heading spaced" hidden><span id="send-order-count" class="muted" role="status"></span><div class="checks"><button id="send-order-prev" type="button" class="small">Previous</button><button id="send-order-next" type="button" class="small">Next</button></div></div>
    <div id="result-list"></div>
    <p id="copy-status" class="status" role="status" hidden></p>
    <textarea id="copy-text" aria-label="Plan text to copy manually" readonly hidden></textarea>
  </section>

</main>
<script src="travian-planner-core.js"></script>
<script>
'use strict';
(() => {
  if (typeof document === 'undefined') return;
  if (!globalThis.TravianDefence) {
    const message = document.getElementById('map-status');
    message.textContent = 'Cannot load travian-planner-core.js. Keep it beside this HTML.';
    message.hidden = false; message.classList.add('error');
    return;
  }
  const {SERVER,TRIBES,HERO_ITEMS,parseMapSql,playersFromMap,createTargetIndex,searchTargets,resolveTarget,targetLabel,normalizeClockTime,parseUTC,formatUTC,formatClock,parseTravcoDefenceCalls,makeProfile,validateProfile,buildPlan,buildCallPlans,availablePlanGroups,restoreSetup,restoreVillageOverview,MAP_LIMIT,integer,isoTime,formatDay,coordText,validateSettings} = globalThis.TravianDefence;
  if (!HERO_ITEMS || !buildCallPlans || !restoreVillageOverview) {
    const message = document.getElementById('map-status');
    message.textContent = 'Update travian-planner-core.js beside this page to use the latest defence planner.';
    message.hidden = false; message.classList.add('error');
    return;
  }


  const $ = id => document.getElementById(id);
  const escape = value => String(value).replace(/[&<>"']/g,ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const mapUrl = point => `${SERVER}/karte.php?x=${point.x}&y=${point.y}`;
  const coordinateLink = (point,label = coordText(point)) =>
    `<a class="coordinate-link mono" href="${escape(mapUrl(point))}" target="_blank" rel="noopener noreferrer" title="Open on the TS12 map">${escape(label)}</a>`;
  function linkedCoordinates(text) {
    return escape(text).replace(/\(([+-]?\d{1,3})\s*\|\s*([+-]?\d{1,3})\)/g,(label,x,y) => {
      const point = {x:Number(x),y:Number(y)};
      return Math.abs(point.x) <= 200 && Math.abs(point.y) <= 200 ? coordinateLink(point,label) : label;
    });
  }
  let villages = [], players = [], selectedId = null, profiles = new Map(), lastPlan = null;
  let mapBusy = false, fetchController = null, sendTimer = null;
  const heroItemVillages = new Set();
  const resultVillageSelections = new Map();
  const selectedCalls = new Set();
  let resultView = 'villages', sendOrderPage = 0, setupCollapsed = false;
  let callsSnapshot = null, callsError = '', callsViewKey = '', selectedCall = null;
  let targetIndex = [], targetPoint = null, suggestions = [], activeSuggestion = -1;
  const currentProfile = () => profiles.get(selectedId);
  const currentPlayer = () => players.find(p => p.id === selectedId);
  function status(id,message,error = false) {
    $(id).innerHTML = linkedCoordinates(message);
    $(id).classList.toggle('error',error);
    $(id).hidden = !message;
  }
  function invalidate() {
    if (lastPlan) status('plan-status','Changed. Calculate again.');
    lastPlan = null;
    $('results').hidden = true;
    $('result-list').replaceChildren();
    $('copy-text').value = ''; $('copy-text').hidden = true; status('copy-status','');
    $('plan-error').hidden = true;
    syncDisplayTimer();
  }
  const targetTabs = ['target','calls'];
  function showTargetTab(tab) {
    for (const name of targetTabs) {
      $(name+'-panel').hidden = name !== tab;
      $('tab-'+name).setAttribute('aria-selected',String(name === tab));

  }
  const copyHtml = entry => `<button class="small" type="button" data-copy-plan="${entry.planIndex}" data-copy-group="${entry.groupIndex}" data-copy-option="${entry.index}">Copy</button>`;
  function destinationHtml(plan) {

  }
  function optionTable(entries,now) {
    return `<div class="table-wrap"><table><thead><tr><th>Troops / hero</th><th>Travel</th><th>Send (UTC)</th><th></th></tr></thead><tbody>${entries.map(entry => {
      const {option,plan} = entry, detail = armyDetail(option);
      return `<tr><td>${lastPlan.plans.length > 1 ? `<div class="call-destination">${destinationHtml(plan)}</div>` : ''}<span class="army">${escape(option.load.label)}</span>${detail ? `<span class="sub">${escape(detail)}</span>` : ''}${equipmentHtml(entry)}</td>
        <td class="mono">${duration(option.seconds)}<span class="sub">${option.speed} fields/h base</span></td>
        <td class="time">${sendHtml(entry,now)}</td><td>${copyHtml(entry)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  }
  function sendOrderTable(entries,now) {
    return `<div class="table-wrap send-order"><table><thead><tr><th>Send (UTC)</th><th>From</th><th>To / landing</th><th>Troops / hero</th><th>Travel</th><th></th></tr></thead><tbody>${entries.map(entry => {
      const {option,plan} = entry, detail = armyDetail(option);
      return `<tr${option.withHero ? ' class="with-hero"' : ''} data-send-option="${entry.planIndex}-${entry.groupIndex}-${entry.index}">
        <td class="time" data-label="Send (UTC)">${sendHtml(entry,now)}</td>
        <td class="route" data-label="From"><strong>${escape(option.origin.name)}</strong> ${coordinateLink(option.origin)}</td>
        <td class="route" data-label="To / landing">${destinationHtml(plan)}</td>

        <td class="mono" data-label="Travel">${duration(option.seconds)}<span class="sub">${option.speed} fields/h base</span></td><td>${copyHtml(entry)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  }
  function renderPlan(resetCopy = true,now = Date.now()) {
    if (!lastPlan) return;
    const plans = lastPlan.plans, plan = plans[0], multiple = plans.length > 1, groups = resultGroups();
    $('results').hidden = false;
    $('results-heading').textContent = 'Send times';
    $('calculated-at').textContent = `Calculated ${formatClock(lastPlan.calculatedAt)} UTC`;
    $('view-villages').setAttribute('aria-pressed',String(resultView === 'villages'));
    $('view-send-order').setAttribute('aria-pressed',String(resultView === 'send-order'));

    const notices = [...new Set(plans.flatMap(value => [

      !value.target ? `${multiple ? coordText(value.settings.target)+' ' : ''}Target not found in map.sql. Verify coordinates.` : '',

      ...value.notices

      : notices.map(message => `<p class="notice">${linkedCoordinates(message)}</p>`).join('');
    const metadata = multiple ? `<details data-details-key="result-targets"><summary>${plans.length} defence calls</summary>${plans.map(value => `<div class="call-destination spaced">${destinationHtml(value)}</div>`).join('')}</details>`
      : `<p><strong>${escape(targetName(plan))} ${coordinateLink(plan.settings.target)}</strong></p>
      <div class="timing-summary">
        <div><span class="eyebrow">${plan.isCallDeadline ? 'Call deadline' : 'Attack lands'}</span><span class="digits">${formatClock(plan.settings.attackMs)}</span><span class="sub">${formatDay(plan.settings.attackMs)} UTC</span></div>
        <div><span class="eyebrow">Defence lands</span><span class="digits good">${formatClock(plan.cutoff)}</span><span class="sub">${formatDay(plan.cutoff)} UTC</span></div>
      </div>`;
    $('result-meta').innerHTML = `${metadata}
      ${total ? `<p class="muted"><strong class="good">${total} available ${total === 1 ? 'option' : 'options'}</strong></p>` : ''}

    $('result-village-filters').hidden = !groups.length;

      $('send-order-paging').hidden = !entries.length;

      `From: ${option.origin.name} ${coordText(option.origin)} -> ${coordText(plan.settings.target)}`,

      $('copy-text').focus(); $('copy-text').select();
      status('copy-status',`${error.message} Copy the selected text below manually.`,true);
    }
  });
  loadMap();

})();
