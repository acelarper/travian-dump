<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com/beacon.min.js; style-src 'unsafe-inline'; connect-src 'self' https://cloudflareinsights.com/cdn-cgi/rum; base-uri 'none'; form-action 'none'">
<title>Travian Defence</title>
<style>
:root{--bg:#0a0e14;--panel:#111923;--field:#0b1119;--line:#283340;--text:#eef4fa;--dim:#a0adbf;--green:#70efd0;--gold:#ffd184;--red:#ff9aab;--mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#15252b 0,var(--bg) 65%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(1120px,calc(100% - 40px));margin:auto;padding:22px 0}
h1,h2,h3,p{margin:0}
h1{font-size:16px;font-weight:650;letter-spacing:-.025em}h1 span{color:var(--dim);font-weight:400}h2{font-size:16px}h3{font-size:14px}
a{color:var(--green)}button,input,select,textarea{font:inherit}
button{border:1px solid var(--line);border-radius:9px;background:#141d27;color:var(--text);padding:8px 12px;cursor:pointer}
button.primary{background:var(--green);color:#10281e;border-color:var(--green);font-weight:650}
button:hover{filter:brightness(1.13)}button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
button.small{font-size:12px;padding:4px 8px}
input:not([type=checkbox]),select,textarea{width:100%;min-width:0;border:1px solid #344251;border-radius:8px;background:var(--field);color:var(--text);padding:9px 11px}
input::placeholder{color:#758397;opacity:1}input[aria-invalid=true]{border-color:var(--red)}
input[type=checkbox]{accent-color:var(--green);width:16px;height:16px;flex-shrink:0}
input[type=file]{font-size:12px}input[type=number]{max-width:110px}
label,legend{display:block;font-size:12px;font-weight:550}label>input:not([type=checkbox]),label>select{margin-top:6px}
fieldset{min-width:0;margin:0;padding:0;border:0}
legend{margin-bottom:5px}summary{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.header,.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.header{margin-bottom:22px}.muted,small{color:var(--dim)}.muted{font-size:12px}.spaced{margin-top:12px}
.hint{margin-top:5px;font-size:11px;color:var(--dim)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.account-row{display:flex;align-items:end;gap:8px;margin-top:16px;flex-wrap:wrap}.account-row label{flex:1;min-width:180px}
.view-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.view-bar+.map-summary{margin:0 0 16px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.check{display:flex;align-items:center;gap:6px;font-weight:400}.checks{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;font-weight:400;font-size:11px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.chip:has(input:checked){border-color:var(--green);color:var(--green)}
.status{color:var(--dim);font-size:12px;margin-top:10px;overflow-wrap:anywhere}
.status.error,.bad{color:var(--red)}.good{color:var(--green)}.warn{color:var(--gold)}
.notice{padding:8px 10px;border-left:2px solid var(--gold);background:#262114;border-radius:4px;font-size:12px;margin-top:10px}
#village-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.village{border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0;align-self:start}
.village:has(.anvil:checked){border-color:#437e70}
.village-name{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.village-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.village-title .village-name{flex:1;min-width:0}
.village fieldset{margin-top:10px}
.ts{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ts input{margin-top:0!important;padding:4px 8px;max-width:65px}
.hero{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.attack-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:14px}
.arrival-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arrival-inputs input{height:44px;font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.arrival-inputs legend{grid-column:1/-1}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.buffer{display:flex;align-items:center;gap:7px;font-weight:400}.buffer input{width:62px;margin:0!important}
.attack-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
.target-control{position:relative;min-width:0}#target-query{height:44px;font-size:14px}
.target-meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#target-map-link{margin-top:10px;font-size:12px}#target-detail{flex:1;min-width:140px}
.target-inputs{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:8px}
#target-x,#target-y{height:44px;padding:9px 5px;text-align:center;font-family:var(--mono)}
.target-options{position:absolute;z-index:10;top:66px;left:0;right:0;max-height:300px;overflow:auto;background:#141f2b;border:1px solid #437e70;border-radius:9px;box-shadow:0 12px 30px #0008}
.target-option{padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.target-option[aria-selected=true],.target-option:hover{background:#203b3a}
.target-option .option-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.target-option .option-owner{font-size:11px;color:var(--dim)}
.target-count{padding:6px 11px;font-size:11px;color:var(--dim)}
.result-village{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.result-heading{padding:10px 12px;background:#141d27}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}
th{color:var(--dim);font-size:11px;font-weight:500;white-space:nowrap}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{min-width:220px;max-width:430px}td.time{min-width:150px}
.mono,.digits{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.digits{letter-spacing:-.045em}.send-time{display:block;font-size:23px;font-weight:600;line-height:1.2;color:var(--green)}
.army{font-weight:600}.sub{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.equipment{font-size:11px;margin-top:5px}.equipment summary{color:var(--green)}
.alternative-summary{padding:9px 12px;color:var(--green);font-size:12px}
.result-village tr:last-child td{border-bottom:0}
#result-meta{margin-top:10px}#copy-text{margin-top:10px;min-height:130px}
.timing-summary{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0}.timing-summary .digits{display:block;font-size:28px;line-height:1.2}
.eyebrow{font-size:10px;color:var(--dim);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
[hidden]{display:none!important}
@media(max-width:720px){
  .attack-grid{grid-template-columns:1fr}
  .table-wrap{overflow:visible}table,tbody{display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .result-village tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px;border-bottom:1px solid var(--line)}
  .result-village tr:last-child{border:0}.result-village td{padding:0;border:0}
  .result-village td:first-child{grid-column:1/-1;min-width:0;max-width:none}
  .result-village td.time{grid-column:1;grid-row:2;min-width:0}
  .result-village td:nth-child(2){grid-column:1;grid-row:3}
  .result-village td:nth-child(2)::before{content:"Travel ";color:var(--dim);font:11px system-ui,sans-serif}
  .result-village td:last-child{grid-column:2;grid-row:3;align-self:center;justify-self:end}
}
@media(max-width:560px){main{width:calc(100% - 28px);padding-top:16px}#village-list{grid-template-columns:1fr}.panel{padding:14px 12px}.account-row label{flex-basis:100%}.arrival-inputs input{padding:9px;font-size:14px}}
@media print{body{background:white;color:black}.setup,td:last-child,th:last-child{display:none}.panel{border:0}.result-village{break-inside:avoid}.sub,.muted,th{color:#444}.good,.warn,.bad,.send-time{color:black}}
</style>
</head>
<body>
<main>
  <header class="header">
    <h1>TRAVIAN <span>/ Defence</span></h1>
    <span class="muted">TS12 &middot; L! / L# / L* &middot; UTC</span>
  </header>
  <noscript><p class="notice">JavaScript is required.</p></noscript>

  <div class="view-bar setup">
    <button id="cancel-fetch" type="button" class="small" hidden>Cancel map load</button>
  </div>
  <p id="map-status" class="status map-summary setup" role="status" hidden></p>

  <section id="setup-panel" class="panel setup" aria-label="Your setup">
    <div class="section-heading">
      <button id="setup-import" type="button">Import setup</button>
      <button id="save-setup" type="button" disabled>Export</button>
    </div>
    <input id="setup-file" type="file" accept=".json,application/json" aria-label="Import setup file" hidden>
    <div id="manual-panel">
      <div class="account-row">
        <label for="player-select">Playing as<select id="player-select" disabled><option value="">Loading accounts...</option></select></label>
      </div>
      <h3 id="anvil-heading" class="spaced" hidden>Anvils</h3>
      <div id="village-list"></div>
      <div id="hero-panel" class="hero" hidden>
        <div class="section-heading"><h3>Hero</h3><span class="muted">Assumed in every anvil</span></div>
        <label class="check spaced"><input id="hero-only" type="checkbox">Include hero-only options</label>
        <p class="hint">Small Standard &middot; Mercenary boots</p>
      </div>
    </div>
    <p id="setup-status" class="status" role="status" hidden></p>
  </section>

  <section class="panel setup" aria-labelledby="attack-heading">
    <h2 id="attack-heading">Incoming attack</h2>
    <div class="attack-grid">
      <div class="target-control">
        <div class="target-inputs">
          <label for="target-query">Target<input id="target-query" type="text" role="combobox" aria-autocomplete="list" aria-controls="target-options" aria-expanded="false" placeholder="Player or village" autocomplete="off" spellcheck="false"></label>
          <label for="target-x">X<input id="target-x" type="number" min="-200" max="200" step="1" autocomplete="off"></label>
          <label for="target-y">Y<input id="target-y" type="number" min="-200" max="200" step="1" autocomplete="off"></label>
        </div>
        <div id="target-options" class="target-options" role="listbox" aria-label="Matching villages" hidden></div>
        <div class="target-meta">
          <a id="target-map-link" class="coordinate-link mono" target="_blank" rel="noopener noreferrer" title="Open on the TS12 map" hidden></a>
          <p id="target-detail" class="status" role="status" hidden></p>
        </div>
      </div>
      <fieldset>
        <legend>Attack lands <span class="muted">(UTC)</span></legend>
        <div class="arrival-inputs">
          <label class="visually-hidden" for="attack-date">Attack date (UTC)</label>
          <input id="attack-date" type="date" min="1000-01-01" max="9999-12-31">
          <label class="visually-hidden" for="attack-time">Attack time (UTC)</label>
          <input id="attack-time" type="text" placeholder="13:10:01" autocomplete="off" spellcheck="false">
        </div>
      </fieldset>
    </div>
    <div class="attack-actions">
      <label class="buffer">Arrive <input id="buffer-seconds" type="number" min="1" max="86400" step="1" value="60" aria-label="Seconds before the attack"> seconds before</label>
    </div>
    <div class="actions">
      <button id="calculate" type="button" class="primary" disabled>Find send times</button>
      <span id="plan-status" class="muted" role="status" hidden></span>
    </div>
    <p id="plan-error" class="status error" role="alert" hidden></p>
  </section>

  <section id="results" class="panel" aria-labelledby="results-heading" hidden>
    <div class="section-heading">
      <h2 id="results-heading">Send times</h2>
      <span id="calculated-at" class="muted"></span>
    </div>
    <div id="result-meta"></div>
    <div id="result-list"></div>
    <p id="copy-status" class="status" role="status" hidden></p>
    <textarea id="copy-text" aria-label="Plan text to copy manually" readonly hidden></textarea>
  </section>

</main>
<script src="travian-planner-core.js"></script>
<script>
'use strict';
(() => {
  if (typeof document === 'undefined') return;
  if (!globalThis.TravianDefence) {
    const message = document.getElementById('map-status');
    message.textContent = 'Cannot load travian-planner-core.js. Keep it beside this HTML.';
    message.hidden = false; message.classList.add('error');
    return;
  }
  const {SERVER,TRIBES,parseMapSql,playersFromMap,createTargetIndex,searchTargets,resolveTarget,targetLabel,normalizeClockTime,parseUTC,formatUTC,formatClock,makeProfile,validateProfile,buildPlan,availablePlanGroups,restoreSetup,MAP_LIMIT,integer,isoTime,formatDay,coordText,validateSettings} = globalThis.TravianDefence;


  const $ = id => document.getElementById(id);
  const escape = value => String(value).replace(/[&<>"']/g,ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const mapUrl = point => `${SERVER}/karte.php?x=${point.x}&y=${point.y}`;
  const coordinateLink = (point,label = coordText(point)) =>
    `<a class="coordinate-link mono" href="${escape(mapUrl(point))}" target="_blank" rel="noopener noreferrer" title="Open on the TS12 map">${escape(label)}</a>`;
  function linkedCoordinates(text) {
    return escape(text).replace(/\(([+-]?\d{1,3})\s*\|\s*([+-]?\d{1,3})\)/g,(label,x,y) => {
      const point = {x:Number(x),y:Number(y)};
      return Math.abs(point.x) <= 200 && Math.abs(point.y) <= 200 ? coordinateLink(point,label) : label;
    });
  }
  let villages = [], players = [], selectedId = null, profiles = new Map(), lastPlan = null;
  let mapBusy = false, fetchController = null, sendTimer = null;
  let targetIndex = [], targetPoint = null, suggestions = [], activeSuggestion = -1;
  const currentProfile = () => profiles.get(selectedId);
  const currentPlayer = () => players.find(p => p.id === selectedId);
  function status(id,message,error = false) {
    $(id).innerHTML = linkedCoordinates(message);
    $(id).classList.toggle('error',error);
    $(id).hidden = !message;
  }
  function invalidate() {
    stopSendCountdown();
    if (lastPlan) status('plan-status','Changed. Find send times again.');
    lastPlan = null;
    $('results').hidden = true;
    $('result-list').replaceChildren();
    $('plan-error').hidden = true;
  }
  function enableControls() {
    $('player-select').disabled = !players.length || mapBusy;
    $('calculate').disabled = mapBusy || !selectedId;
    $('save-setup').disabled = !selectedId || mapBusy;
    $('setup-file').disabled = mapBusy;
    $('setup-import').disabled = mapBusy;
  }
  function renderPlayers() {
    $('player-select').innerHTML = '<option value="">Select your account</option>' + players.map(p =>
      `<option value="${p.id}">${escape(p.name)} [${escape([...p.alliances].join(', '))}]</option>`).join('');
    $('player-select').value = selectedId === null ? '' : String(selectedId);
  }
  function checkChips(units,values,did,kind) {
    return units.map(unit => `<label class="chip"><input type="checkbox" data-village="${did}" data-kind="${kind}" value="${unit.id}"${values.includes(unit.id) ? ' checked' : ''}>${escape(unit.name)} <span class="muted">${unit.speed}/h</span></label>`).join('');
  }
  function renderVillages() {
    const player = currentPlayer();
    $('anvil-heading').hidden = !player;
    if (!player) {
      $('village-list').replaceChildren();
      $('hero-panel').hidden = true;
      return;
    }
    const profile = currentProfile();
    $('village-list').innerHTML = [...player.villages].sort((a,b) => a.name.localeCompare(b.name,undefined,{numeric:true})).map(village => {
      const config = profile.villages.find(v => v.did === village.did);
      const tribe = TRIBES[village.tribe];
      return `<article class="village">
        <div class="village-title"><label class="check village-name"><input class="anvil" type="checkbox" data-village="${village.did}" data-kind="enabled"${config.enabled ? ' checked' : ''}${!tribe ? ' disabled' : ''}>${escape(village.name)}</label>${coordinateLink(village)}</div>
        <fieldset id="fields-${village.did}"${config.enabled ? '' : ' hidden disabled'}>
          <label class="ts">Tournament Square <input type="number" min="0" max="20" step="1" value="${config.ts}" data-village="${village.did}" data-kind="ts" aria-label="Tournament Square for ${escape(village.name)}"></label>
          <fieldset><legend>Defenders</legend><div class="checks">${tribe ? checkChips(tribe.units.slice(0,6),config.defenders,village.did,'defenders') : ''}</div></fieldset>
          <details class="spaced"><summary class="muted">Slow escorts</summary><div class="checks spaced">${tribe ? checkChips(tribe.units,config.escorts,village.did,'escorts') : ''}</div></details>
        </fieldset>
      </article>`;
    }).join('');
    $('hero-panel').hidden = false;
    renderHero();
  }
  function renderHero() {
    const profile = currentProfile();
    if (profile) $('hero-only').checked = profile.hero.solo;
  }
  function installMap(parsed) {
    const nextPlayers = playersFromMap(parsed), nextProfiles = new Map();
    let discarded = 0;
    for (const player of nextPlayers) {
      const fresh = makeProfile(player), old = profiles.get(player.id);
      if (old) {
        for (const config of old.villages) {
          const index = fresh.villages.findIndex(v => v.did === config.did && v.tribe === config.tribe && v.x === config.x && v.y === config.y);
          if (index >= 0) fresh.villages[index] = config;
          else if (config.enabled) discarded++;
        }
        fresh.hero = {...old.hero};
      }
      nextProfiles.set(player.id,fresh);
    }
    const accountRemoved = selectedId !== null && !nextProfiles.has(selectedId);
    villages = parsed; players = nextPlayers; profiles = nextProfiles;
    targetIndex = createTargetIndex(villages);
    hideSuggestions();
    if (targetPoint) presentTarget(targetPoint);
    if (accountRemoved) selectedId = null;
    invalidate(); renderPlayers(); renderVillages(); enableControls();
    status('map-status',`${villages.length.toLocaleString()} villages; ${players.length} accounts - map.sql.${!players.length ? ' No allied accounts found; check the server.' : ''}${discarded ? ` ${discarded} removed anvils no longer match.` : ''}${accountRemoved ? ' Select an account again.' : ''}`);
    $('map-status').title = `Map loaded ${formatUTC(Date.now())}`;
  }
  function setMapBusy(busy) {
    mapBusy = busy;
    $('cancel-fetch').hidden = !fetchController;
    enableControls();
  }
  async function loadMap() {
    fetchController = new AbortController();
    setMapBusy(true);
    status('map-status','Loading map.sql...');
    try {
      const response = await fetch(new URL('map.sql',location.href),{mode:'same-origin',credentials:'omit',cache:'no-store',redirect:'error',signal:fetchController.signal});
      if (!response.ok) throw new Error(response.status === 404 ? 'map.sql was not found beside this page (HTTP 404)' : `HTTP ${response.status}`);
      if (Number(response.headers.get('content-length')) > MAP_LIMIT) throw new Error('Map exceeds 40 MB');
      const sql = await response.text();
      installMap(parseMapSql(sql));
    } catch (error) {
      const cancelled = error.name === 'AbortError';
      if (!villages.length) $('player-select').innerHTML = '<option value="">Map unavailable</option>';
      status('map-status',cancelled ? 'Loading cancelled.' : location.protocol === 'file:'
        ? 'Open this page through localhost. Your browser blocks automatic map.sql reads from file://.'
        : `Map load failed: ${error.message}. Reload the page to try again.`,!cancelled);
    } finally { fetchController = null; setMapBusy(false); }
  }
  $('cancel-fetch').addEventListener('click',() => fetchController?.abort());
  $('setup-import').addEventListener('click',() => {
    if (mapBusy) return;
    $('setup-file').value = '';
    $('setup-file').click();
  });
  $('player-select').addEventListener('change',() => {
    selectedId = $('player-select').value ? Number($('player-select').value) : null;
    invalidate(); renderVillages(); enableControls();
    status('setup-status','');
  });
  $('village-list').addEventListener('input',event => {
    const input = event.target;
    if (!input.dataset.village || !currentProfile()) return;
    const config = currentProfile().villages.find(v => v.did === Number(input.dataset.village));
    const kind = input.dataset.kind;
    if (kind === 'enabled') {
      config.enabled = input.checked;
      $(`fields-${config.did}`).hidden = !config.enabled;
      $(`fields-${config.did}`).disabled = !config.enabled;
    } else if (kind === 'ts') config.ts = input.valueAsNumber;
    else if (kind === 'defenders' || kind === 'escorts') {
      const id = Number(input.value);
      config[kind] = input.checked ? [...new Set([...config[kind],id])] : config[kind].filter(value => value !== id);
    }
    invalidate();
  });
  $('hero-only').addEventListener('change',() => {
    currentProfile().hero.solo = $('hero-only').checked;
    invalidate(); renderHero();
  });
  function hideSuggestions() {
    suggestions = []; activeSuggestion = -1;
    $('target-options').hidden = true;
    $('target-options').replaceChildren();
    $('target-query').setAttribute('aria-expanded','false');
    $('target-query').removeAttribute('aria-activedescendant');
  }
  function presentTarget(point,updateCoordinates = true) {
    targetPoint = {x:point.x,y:point.y};
    const village = villages.find(v => v.x === point.x && v.y === point.y);
    $('target-query').value = village ? targetLabel(village) : '';
    if (updateCoordinates) {
      $('target-x').value = point.x;
      $('target-y').value = point.y;
    }
    $('target-map-link').href = mapUrl(point);
    $('target-map-link').textContent = coordText(point);
    $('target-map-link').hidden = false;
    status('target-detail',village ? village.alliance || 'No alliance' : 'Not found in map.sql. Using these coordinates.');
    $('target-detail').classList.toggle('warn',!village);
    hideSuggestions();
  }
  function clearTargetSelection() {
    targetPoint = null;
    $('target-map-link').hidden = true;
    $('target-map-link').removeAttribute('href');
    $('target-map-link').textContent = '';
    $('target-detail').classList.remove('warn');
  }
  function coordinateTarget() {
    return {x:integer($('target-x').valueAsNumber,-200,200,'Target X'),
      y:integer($('target-y').valueAsNumber,-200,200,'Target Y')};
  }
  function readTarget() {
    const hasCoordinates = ['target-x','target-y'].some(id => $(id).value !== '' || $(id).validity.badInput);
    return hasCoordinates ? coordinateTarget() : resolveTarget(targetIndex,$('target-query').value);
  }
  function showSuggestions() {
    const result = searchTargets(targetIndex,$('target-query').value);
    hideSuggestions();
    suggestions = result.matches;
    if (!suggestions.length) return;
    $('target-options').innerHTML = suggestions.map((v,index) =>
      `<div class="target-option" role="option" id="target-option-${index}" data-target-index="${index}" aria-selected="false">
        <div class="option-name"><strong>${escape(v.name)}</strong>${coordinateLink(v)}</div>
        <div class="option-owner">${escape(v.player)}${v.alliance ? ' ['+escape(v.alliance)+']' : ''}</div>
      </div>`).join('') + (result.count > suggestions.length ? `<div class="target-count" role="presentation">${suggestions.length} / ${result.count} matches</div>` : '');
    $('target-options').hidden = false;
    $('target-query').setAttribute('aria-expanded','true');
  }
  function pickSuggestion(index) {
    const village = suggestions[index];
    if (!village) return;
    invalidate();
    presentTarget(village);
    $('target-query').focus();
    hideSuggestions();
  }
  $('target-query').addEventListener('input',() => {
    clearTargetSelection();
    $('target-x').value = ''; $('target-y').value = '';
    status('target-detail','');
    invalidate(); showSuggestions();
  });
  for (const id of ['target-x','target-y']) $(id).addEventListener('input',() => {
    clearTargetSelection();
    $('target-query').value = '';
    invalidate(); hideSuggestions();
    if ($('target-x').value === '' || $('target-y').value === '') {
      status('target-detail','Enter both coordinates.');
      return;
    }
    try { presentTarget(coordinateTarget(),false); }
    catch (error) { status('target-detail',error.message,true); }
  });
  $('target-query').addEventListener('focus',showSuggestions);
  $('target-query').addEventListener('blur',hideSuggestions);
  $('target-query').addEventListener('keydown',event => {
    if (event.key === 'Escape') { hideSuggestions(); return; }
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if ($('target-options').hidden) showSuggestions();
      if (!suggestions.length) return;
      event.preventDefault();
      activeSuggestion = event.key === 'ArrowDown' ? (activeSuggestion+1)%suggestions.length
        : (activeSuggestion < 0 ? suggestions.length-1 : (activeSuggestion-1+suggestions.length)%suggestions.length);
      for (let i=0;i<suggestions.length;i++) $('target-option-'+i).setAttribute('aria-selected',String(i === activeSuggestion));
      const option = $('target-option-'+activeSuggestion);
      $('target-query').setAttribute('aria-activedescendant',option.id);
      option.scrollIntoView({block:'nearest'});
    } else if (event.key === 'Enter') {
      event.preventDefault();
      if (activeSuggestion >= 0 || suggestions.length === 1) pickSuggestion(activeSuggestion >= 0 ? activeSuggestion : 0);
      else {
        try { presentTarget(resolveTarget(targetIndex,$('target-query').value)); }
        catch (error) { status('plan-error',error.message,true); }
      }
    }
  });
  $('target-options').addEventListener('pointerdown',event => {
    if (event.target.closest('[data-target-index]')) event.preventDefault();
  });
  $('target-options').addEventListener('click',event => {
    if (event.target.closest('a.coordinate-link')) return;
    const option = event.target.closest('[data-target-index]');
    if (option) pickSuggestion(Number(option.dataset.targetIndex));
  });
  function normalizeAttackInput() {
    if (!$('attack-time').value.trim()) return;
    try {
      $('attack-time').value = normalizeClockTime($('attack-time').value);
      $('attack-time').setAttribute('aria-invalid','false');
    } catch (error) {
      $('attack-time').setAttribute('aria-invalid','true');
      invalidate(); status('plan-error',error.message,true);
    }
  }
  $('attack-time').addEventListener('blur',normalizeAttackInput);
  $('attack-time').addEventListener('keydown',event => {
    if (event.key === 'Enter') { event.preventDefault(); normalizeAttackInput(); }
  });
  $('attack-time').addEventListener('input',event => {
    $('attack-time').setAttribute('aria-invalid','false');
    invalidate();
    if (event.inputType === 'insertFromPaste') normalizeAttackInput();
  });
  for (const id of ['attack-date','buffer-seconds']) $(id).addEventListener('input',invalidate);
  $('attack-date').value = isoTime(Date.now()).slice(0,10);
  function defenceSettings() {
    return validateSettings({buffer:$('buffer-seconds').valueAsNumber});
  }
  function download(text,filename) {
    const blob = new Blob([text],{type:'application/json'});
    if (blob.size > MAP_LIMIT) throw new Error('Settings file exceeds 40 MB.');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = filename;
    document.body.append(link); link.click(); link.remove(); URL.revokeObjectURL(url);
  }
  $('save-setup').addEventListener('click',() => {
    try {
      const profile = validateProfile(currentProfile(),villages);
      const value = {version:7,server:SERVER,savedAt:new Date().toISOString(),profile,settings:defenceSettings()};
      download(JSON.stringify(value,null,2),`ts12-defence-setup-${selectedId}.json`);
      status('setup-status','Exported player and defence settings.');
    } catch (error) { status('setup-status',`Cannot export: ${error.message}`,true); }
  });
  $('setup-file').addEventListener('change',async () => {
    if (mapBusy) return;
    const file = $('setup-file').files[0];
    if (!file) return;
    setMapBusy(true);
    status('setup-status',`Importing ${file.name}...`);
    try {
      if (file.size > MAP_LIMIT) throw new Error('Setup file exceeds 40 MB.');
      const saved = restoreSetup(JSON.parse(await file.text()),villages);
      profiles.set(saved.profile.playerId,saved.profile); selectedId = saved.profile.playerId;
      $('buffer-seconds').value = saved.settings.buffer;
      invalidate(); renderPlayers(); renderVillages(); enableControls();
      status('setup-status',`Imported ${file.name}.`);
    } catch (error) { status('setup-status',`Import failed: ${error.message}`,true); }
    finally { setMapBusy(false); }
  });
  function duration(seconds) {
    const rounded = Math.round(Math.abs(seconds));
    const days = Math.floor(rounded/86400), hours = Math.floor(rounded%86400/3600);
    const minutes = Math.floor(rounded%3600/60), secs = rounded%60;
    return `${days ? days+'d ' : ''}${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }
  function optionTable(options,groupIndex,offset,now) {
    return `<div class="table-wrap"><table><thead><tr><th>Troops / hero</th><th>Travel</th><th>Send (UTC)</th><th></th></tr></thead><tbody>${options.map((option,index) => {
      const equipment = option.equipment;
      const waitSeconds = Math.ceil((option.sendAt-now)/1000);
      const equipmentHTML = equipment.length === 1 ? `<span class="sub">${option.withHero ? 'Hero: ' : ''}${escape(equipment[0].label)}</span>`
        : `<details class="equipment" data-details-key="gear-${option.origin.did}-${option.load.key}-${option.withHero}-${option.seconds}"><summary>Hero: ${equipment.length} equipment options</summary>${equipment.map(e => `<div>${escape(e.label)}</div>`).join('')}</details>`;
      return `<tr><td><span class="army">${escape(option.load.label)}</span>${option.load.detail ? `<span class="sub">${escape(option.load.detail)}</span>` : ''}${equipmentHTML}</td>
        <td class="mono">${duration(option.seconds)}<span class="sub">${option.speed} fields/h base</span></td>
        <td class="time"><span class="digits send-time">${formatClock(option.sendAt)}</span><span class="sub">${formatDay(option.sendAt)}</span><span class="sub mono send-wait" data-send-at="${option.sendAt}" title="Live countdown">Send in ${duration(waitSeconds)}</span></td>
        <td><button class="small" type="button" data-copy-group="${groupIndex}" data-copy-option="${index+offset}">Copy</button></td></tr>`;
    }).join('')}</tbody></table></div>`;
  }
  function renderPlan(resetCopy = true,now = Date.now()) {
    if (!lastPlan) return;
    const plan = lastPlan;
    $('results').hidden = false;
    $('results-heading').textContent = 'Send times';
    $('calculated-at').textContent = `Calculated ${formatClock(plan.settings.calculatedAt)} UTC`;
    const total = plan.groups.reduce((n,g) => n+g.options.length,0);
    const targetText = plan.target ? `${plan.target.name} - ${plan.target.player}` : 'Unknown village';
    $('result-meta').innerHTML = `<p><strong>${escape(targetText)} ${coordinateLink(plan.settings.target)}</strong></p>
      <div class="timing-summary">
        <div><span class="eyebrow">Attack lands</span><span class="digits">${formatClock(plan.settings.attackMs)}</span><span class="sub">${formatDay(plan.settings.attackMs)} UTC</span></div>
        <div><span class="eyebrow">Defence lands</span><span class="digits good">${formatClock(plan.cutoff)}</span><span class="sub">${formatDay(plan.cutoff)} UTC</span></div>
      </div>
      ${total ? `<p class="muted"><strong class="good">${total} available ${total === 1 ? 'option' : 'options'}</strong></p>` : ''}
      ${!total && !plan.notices.length ? '<p class="notice">No available options for this landing time.</p>' : ''}
      ${!plan.target ? '<p class="notice">Target not found in this map. Check the coordinates or load a newer map.</p>' : ''}
      ${plan.notices.map(n => `<p class="notice">${linkedCoordinates(n)}</p>`).join('')}`;
    $('result-list').innerHTML = plan.groups.map((group,index) => {
      const head = group.options.slice(0,3), rest = group.options.slice(3);
      return `<article class="result-village"><div class="result-heading"><h3>${escape(group.origin.name)} ${coordinateLink(group.origin)}</h3><span class="muted">${group.fields.toFixed(2)} fields &middot; TS ${group.ts} &middot; ${group.options.length} options</span></div>
        ${optionTable(head,index,0,now)}
        ${rest.length ? `<details data-details-key="alternatives-${group.origin.did}"><summary class="alternative-summary">${rest.length} more options</summary>${optionTable(rest,index,3,now)}</details>` : ''}</article>`;
    }).join('');
    if (resetCopy) { status('copy-status',''); $('copy-text').hidden = true; }
  }
  function stopSendCountdown() {
    if (sendTimer !== null) clearInterval(sendTimer);
    sendTimer = null;
  }
  function updateSendCountdown() {
    if (!lastPlan) { stopSendCountdown(); return; }
    const now = Date.now();
    if (lastPlan.groups.some(group => group.options.some(option => option.sendAt < now))) {
      const expanded = new Set([...$('result-list').querySelectorAll('details[data-details-key][open]')].map(e => e.dataset.detailsKey));
      lastPlan.groups = availablePlanGroups(lastPlan,now);
      renderPlan(false,now);
      for (const details of $('result-list').querySelectorAll('details[data-details-key]')) {
        details.open = expanded.has(details.dataset.detailsKey);
      }
    }
    for (const label of $('result-list').querySelectorAll('.send-wait')) {
      const text = `Send in ${duration(Math.ceil((Number(label.dataset.sendAt)-now)/1000))}`;
      if (label.textContent !== text) label.textContent = text;
    }
    if (!lastPlan.groups.length) stopSendCountdown();
  }
  function startSendCountdown() {
    stopSendCountdown();
    updateSendCountdown();
    if (lastPlan?.groups.length) sendTimer = setInterval(updateSendCountdown,1000);
  }
  document.addEventListener('visibilitychange',() => { if (!document.hidden) updateSendCountdown(); });
  $('calculate').addEventListener('click',() => {
    invalidate();
    try {
      const target = readTarget(), time = normalizeClockTime($('attack-time').value);
      const preferences = defenceSettings(), calculatedAt = Date.now();
      const settings = {target,attackMs:parseUTC(`${$('attack-date').value}T${time}`,'Attack landing'),
        referenceMs:calculatedAt,
        buffer:preferences.buffer,calculatedAt};
      const plan = buildPlan(villages,currentProfile(),settings);
      const now = Date.now();
      plan.groups = availablePlanGroups(plan,now);
      lastPlan = plan;
      presentTarget(settings.target);
      $('attack-time').value = time;
      $('attack-time').setAttribute('aria-invalid','false');
      renderPlan(true,now);
      startSendCountdown();
      status('plan-status','');
    } catch (error) {
      $('plan-error').hidden = false;
      status('plan-error',error.message,true);
    }
  });
  $('result-list').addEventListener('click',async event => {
    const button = event.target.closest('button[data-copy-group]');
    if (!button || !lastPlan) return;
    const option = lastPlan.groups[Number(button.dataset.copyGroup)].options[Number(button.dataset.copyOption)];
    if (option.sendAt < Date.now()) {
      updateSendCountdown();
      $('copy-text').hidden = true; $('copy-text').value = '';
      status('copy-status','This send time has passed. Choose another option.',true);
      return;
    }
    const text = [
      `TS12 defence - ${option.origin.player}`,
      `From: ${option.origin.name} ${coordText(option.origin)} -> ${coordText(lastPlan.settings.target)}`,
      `Troops: ${option.load.label}${option.load.detail ? '. '+option.load.detail : ''}`,
      `Equipment: ${option.equipment.map(e => e.label).join(' OR ')}`,
      `Send: ${formatUTC(option.sendAt)}`,
      `Arrival: ${formatUTC(lastPlan.cutoff)}; attack: ${formatUTC(lastPlan.settings.attackMs)}`,
      `Travel: ${duration(option.seconds)}`,
      !lastPlan.target ? 'Target not found in the map; check coordinates.' : ''
    ].filter(Boolean).join('\n');
    try {
      if (!navigator.clipboard?.writeText) throw new Error('Clipboard access is unavailable in this browser.');
      await navigator.clipboard.writeText(text);
      $('copy-text').hidden = true; $('copy-text').value = '';
      status('copy-status','Copied.');
    } catch (error) {
      $('copy-text').value = text; $('copy-text').hidden = false;
      $('copy-text').focus(); $('copy-text').select();
      status('copy-status',`${error.message} Copy the selected text below manually.`,true);
    }
  });
  loadMap();

})();
</script>
